[env:cboard_chassis]
platform = ststm32@20.0.0
board = genericSTM32F407IGT6
framework = stm32cube
board_build.f_cpu = 168000000L
board_build.stm32cube.custom_config_header = yes
build_flags =
  -DHSE_VALUE=12000000U
  -DHSI_VALUE=16000000U
  -Wl,-Map,firmware.map
build_type = debug
debug_tool = custom
debug_server =
  ${platformio.packages_dir}/tool-openocd/bin/openocd
  -c
  adapter driver cmsis-dap
  -c
  transport select swd
  -f
  target/stm32f4x.cfg
  -c
  adapter speed 1000
upload_protocol = custom
; 将当前构建环境传给部署器，诊断环境不能误刷控制镜像。
upload_command = python3 tools/deploy.py --env $PIOENV

; 接收链路诊断：CAN 始终发四路零电流，只用于核对遥控与 IMU。
[env:cboard_diagnostic]
extends = env:cboard_chassis
build_flags =
  ${env:cboard_chassis.build_flags}
  -DMOTOR_OUTPUT_ENABLE=0
  -DRC_DRIVE_ENABLE=0
